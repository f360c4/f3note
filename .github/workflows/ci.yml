# Continuous integration: every push and every pull request is built and
# tested here, on a clean machine, before anyone looks at it.
#
# Two security properties matter more than the tests:
#
#   Actions are pinned to commit hashes, not tags. A tag like @v4 is a moving
#   pointer the action's owner can repoint at any time, including at code that
#   steals whatever the workflow can reach. A hash cannot be repointed.
#
#   The token is read-only and is not left behind on the runner. A pull
#   request from a stranger runs here; it must not be able to write anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. A workflow with a write token is what turns a
# malicious pull request into a compromised repository: it can push, tag, or
# open releases using credentials the attacker never had. Nothing here needs
# to write anything, so nothing here can.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Without this, checkout leaves a token in .git/config that any
          # later step — including one added by a pull request — could use.
          persist-credentials: false

      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Formatting
        run: cargo fmt --check

      # A borrow guard that outlives the statement that created it has caused
      # three separate crashes here. The shape is banned outright.
      - name: Borrow guards
        run: ./scripts/check-borrows.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      # The window tests need a compositor. Everything else above runs
      # headless; this gives the GTK glue somewhere to draw.
      - name: Window and recovery tests
        run: |
          sudo apt-get install -y weston
          mkdir -p "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-ci --idle-time=0 &
          sleep 3
          export WAYLAND_DISPLAY=wayland-ci
          cargo build --release
          G_DEBUG=fatal-criticals ./target/release/uitest
          ./scripts/crashtest.sh
        env:
          XDG_RUNTIME_DIR: /tmp/runtime-ci

  licenses:
    name: Dependency licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Without this, checkout leaves a token in .git/config that any
          # later step — including one added by a pull request — could use.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # main
        with:
          tool: cargo-deny
      - run: cargo deny check licenses

  msrv:
    name: Declared minimum Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Without this, checkout leaves a token in .git/config that any
          # later step — including one added by a pull request — could use.
          persist-credentials: false
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev
      # Checks that rust-version in Cargo.toml is true, rather than aspirational.
      #
      # It says 1.92 because the gtk-rs crates require it, and that is higher
      # than several distributions ship: Debian 13 has 1.85, Alpine 3.22 has
      # 1.87, Ubuntu 24.04 has 1.91. Building from source on those needs
      # rustup. Wishing for a lower number does not make one possible; the
      # honest response is to state it and let packagers plan around it.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.92.0"
      - run: cargo check --locked

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    # Not the oldest runner, though that was the intent and would be better.
    #
    # An AppImage is only useful on systems older than the one that built it,
    # and it was meant to cover Ubuntu 22.04, Debian 12 and RHEL 9, whose GTK
    # is too old to build f3note natively. But that is the same reason it
    # cannot be built there: ubuntu-22.04 ships GTK 4.6 and the build fails
    # outright. The oldest runner that can build this is ubuntu-24.04, whose
    # glibc is 2.39 — higher than any of those three have.
    #
    # So this AppImage is a convenience for people who could also have built
    # it, not a way onto older systems. Said plainly in the README rather than
    # left to be discovered. Flatpak is the route that would actually work
    # there, and is not built yet.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Without this, checkout leaves a token in .git/config that any
          # later step — including one added by a pull request — could use.
          persist-credentials: false
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev libfuse2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: ./scripts/build-appimage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f3note-x86_64.AppImage
          path: target/f3note-x86_64.AppImage
