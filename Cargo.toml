[package]
name = "f3note"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "A fast, minimal tabbed text editor for Wayland with crash-proof autosave"
repository = "https://github.com/f360c4/f3note"
license = "MIT"
readme = "README.md"
keywords = ["editor", "wayland", "gtk4", "hyprland"]
categories = ["text-editors"]

# API ceiling is deliberate: v4_12 / v5_10 are the newest APIs available on the
# oldest distros we promise native packages for (Ubuntu 24.04, openSUSE Leap
# 15.6, RHEL 10). Raising these silently drops those targets. See docs/PORTING.md
[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
sourceview5 = { version = "0.11", features = ["v5_10"] }
blake3 = "1"
encoding_rs = "0.8"
chardetng = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zstd = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
